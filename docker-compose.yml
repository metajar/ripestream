services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ripestream-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ripestream
    ports:
      - "8123:8123"  # HTTP interface (what ripestream uses)
      - "9000:9000"  # native protocol (clickhouse-client / ch-cli)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    container_name: ripestream-falkordb
    ports:
      - "6379:6379"  # Redis protocol (falkordb-go)
      - "3000:3000"  # FalkorDB Browser UI
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  clickhouse-data:
  clickhouse-logs:
  falkordb-data:
