services:
  ripestream:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RIPESTREAM_CLICKHOUSE: http://clickhouse:8123
      RIPESTREAM_USER: ${CLICKHOUSE_USER:-default}
      RIPESTREAM_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in Dokploy}
      RIPESTREAM_DB: ${CLICKHOUSE_DB:-ripestream}
      RIPESTREAM_FALKOR_ADDR: falkordb:6379
      RIPESTREAM_FALKOR_GRAPH: ${FALKORDB_GRAPH:-ripestream}
      RIPESTREAM_FALKOR_ENABLED: "true"
      RIPESTREAM_HTTP_ADDR: :8080
      RIPESTREAM_UI_ENABLED: "true"
      RIPESTREAM_ALERT_ENABLED: "true"
      RIPESTREAM_DB_PATH: /data/ripestream.db
      RIPESTREAM_ASN_DB: /data/geolite/GeoLite2-ASN.mmdb
      RIPESTREAM_LOG_LEVEL: ${RIPESTREAM_LOG_LEVEL:-info}
      GEOLITE_DB_PATH: /data/geolite/GeoLite2-ASN.mmdb
      GEOLITE_DB_SHA256: ${GEOLITE_DB_SHA256:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Set R2_ACCOUNT_ID in Dokploy}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in Dokploy}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in Dokploy}
      R2_BUCKET: ${R2_BUCKET:?Set R2_BUCKET in Dokploy}
      R2_OBJECT_KEY: ${R2_OBJECT_KEY:-GeoLite2-ASN.mmdb}
      R2_JURISDICTION: ${R2_JURISDICTION:-default}
    expose:
      - "8080"
    volumes:
      - ripestream-data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in Dokploy}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ripestream}
    expose:
      - "8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q --user=\"$${CLICKHOUSE_USER}\" --password=\"$${CLICKHOUSE_PASSWORD}\" http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  falkordb:
    image: ${FALKORDB_IMAGE:-falkordb/falkordb:latest}
    expose:
      - "6379"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  ripestream-data:
  clickhouse-data:
  clickhouse-logs:
  falkordb-data:
